<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="92" height="92" x="4" y="4" rx="22" fill="#0A0E17" stroke="url(#grad-ring)" stroke-width="2" />
  
  <!-- AST Connection Nodes (Subtle graph) -->
  <g opacity="0.35" stroke="#00F0FF" stroke-width="1.2">
    <line x1="24" y1="28" x2="42" y2="46" />
    <line x1="76" y1="28" x2="58" y2="46" />
    <line x1="42" y1="46" x2="50" y2="74" />
    <circle cx="24" cy="28" r="3" fill="#00F0FF" />
    <circle cx="76" cy="28" r="3" fill="#7000FF" />
    <circle cx="50" cy="74" r="3" fill="#FF007A" />
  </g>

  <!-- Central High-Voltage AST Lightning Bolt -->
  <polygon points="54,14 26,50 48,50 42,86 74,44 52,44" fill="url(#grad-bolt)" filter="url(#glow)" />
</svg>
