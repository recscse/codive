<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0b0d12" />
    </radialGradient>
    <linearGradient id="dive-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ee1ff" />
      <stop offset="100%" stop-color="#2a8fb0" />
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Dive arrow, plunging down toward the surfaced structure -->
  <g filter="url(#soft-glow)">
    <line x1="128" y1="28" x2="128" y2="96" stroke="url(#dive-grad)" stroke-width="9" stroke-linecap="round" />
    <path d="M 101 73 L 128 100 L 155 73" stroke="url(#dive-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- AST node cluster: the structure the dive surfaces -->
  <g filter="url(#soft-glow)">
    <line x1="128" y1="120" x2="103" y2="150" stroke="#5ee1ff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="128" y1="120" x2="153" y2="150" stroke="#5ee1ff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="103" y1="150" x2="153" y2="150" stroke="#20c20e" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <circle cx="128" cy="120" r="10" fill="#5ee1ff" />
    <circle cx="103" cy="150" r="8" fill="#20c20e" />
    <circle cx="153" cy="150" r="8" fill="#20c20e" />
  </g>

  <!-- Ripples: the impact of surfacing it -->
  <g stroke="#5ee1ff" fill="none" stroke-width="2.5">
    <ellipse cx="128" cy="182" rx="28" ry="7.5" opacity="0.55" />
    <ellipse cx="128" cy="182" rx="50" ry="13" opacity="0.3" />
    <ellipse cx="128" cy="182" rx="72" ry="18.5" opacity="0.14" />
  </g>
</svg>
