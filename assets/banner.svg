<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow-1" cx="18%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5ee1ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#20c20e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaf6ff" />
      <stop offset="100%" stop-color="#bfe9ff" />
    </linearGradient>
    <linearGradient id="dive-grad-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ee1ff" />
      <stop offset="100%" stop-color="#2a8fb0" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee1ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#0b0d12" />
  <rect width="1200" height="380" rx="16" fill="url(#bg-glow-1)" />
  <rect width="1200" height="380" rx="16" fill="url(#bg-glow-2)" />
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Faint AST grid, right side -->
  <g opacity="0.22" stroke="#5ee1ff" stroke-width="1.5">
    <line x1="840" y1="90" x2="950" y2="150" />
    <line x1="950" y1="150" x2="1080" y2="110" />
    <line x1="950" y1="150" x2="910" y2="260" />
    <line x1="910" y1="260" x2="1040" y2="295" />
    <line x1="1080" y1="110" x2="1130" y2="220" />
    <circle cx="840" cy="90" r="5" fill="#5ee1ff" />
    <circle cx="950" cy="150" r="7" fill="#20c20e" />
    <circle cx="1080" cy="110" r="5" fill="#5ee1ff" />
    <circle cx="910" cy="260" r="6" fill="#5ee1ff" />
    <circle cx="1040" cy="295" r="5" fill="#20c20e" />
    <circle cx="1130" cy="220" r="6" fill="#5ee1ff" />
  </g>

  <!-- Icon: dive arrow surfacing an AST node cluster, with ripples -->
  <g transform="translate(178, 130)" filter="url(#glow-heavy)">
    <line x1="0" y1="0" x2="0" y2="48" stroke="url(#dive-grad-b)" stroke-width="7" stroke-linecap="round" />
    <path d="M -21 30 L 0 51 L 21 30" stroke="url(#dive-grad-b)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <line x1="0" y1="66" x2="-19" y2="90" stroke="#5ee1ff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="0" y1="66" x2="19" y2="90" stroke="#5ee1ff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="-19" y1="90" x2="19" y2="90" stroke="#20c20e" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <circle cx="0" cy="66" r="7" fill="#5ee1ff" />
    <circle cx="-19" cy="90" r="5.5" fill="#20c20e" />
    <circle cx="19" cy="90" r="5.5" fill="#20c20e" />

    <g stroke="#5ee1ff" fill="none" stroke-width="2">
      <ellipse cx="0" cy="112" rx="20" ry="5.5" opacity="0.5" />
      <ellipse cx="0" cy="112" rx="36" ry="9.5" opacity="0.28" />
      <ellipse cx="0" cy="112" rx="52" ry="13.5" opacity="0.12" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(300, 130)">
    <text x="0" y="52" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="68" font-weight="700" fill="url(#text-grad)" letter-spacing="-1px">
      codive
    </text>
    <text x="230" y="52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="20" font-weight="600" fill="#5ee1ff" opacity="0.9">
      v1.0.0
    </text>

    <text x="0" y="94" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#eaf0f7">
      Local-first AST context engine for AI coding agents
    </text>

    <text x="0" y="126" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#8791a3">
      Structural skeletons, symbol graphs &amp; blast-radius analysis over MCP — zero cloud telemetry
    </text>

    <g transform="translate(0, 150)" font-family="Manrope, -apple-system, sans-serif" font-size="11" font-weight="700">
      <rect width="114" height="26" rx="6" fill="#161b26" />
      <text x="57" y="17" text-anchor="middle" fill="#c9d3e0">Claude Code</text>

      <rect x="122" width="76" height="26" rx="6" fill="#161b26" />
      <text x="160" y="17" text-anchor="middle" fill="#c9d3e0">Cursor</text>

      <rect x="206" width="90" height="26" rx="6" fill="#161b26" />
      <text x="251" y="17" text-anchor="middle" fill="#c9d3e0">Windsurf</text>

      <rect x="304" width="102" height="26" rx="6" fill="#161b26" />
      <text x="355" y="17" text-anchor="middle" fill="#c9d3e0">Antigravity</text>

      <rect x="414" width="124" height="26" rx="6" fill="rgba(94,225,255,0.14)" stroke="#5ee1ff" stroke-width="1" />
      <text x="476" y="17" text-anchor="middle" fill="#5ee1ff" font-weight="800">14 MCP Tools</text>
    </g>
  </g>
</svg>
