<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codive explorer</title>
<style>
@font-face { font-family: "Geist"; src: url("/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #fbfaf6; --panel: #fbfaf6; --raised: #f2f0e8; --line: #e2dfd4;
  --text: #55534a; --dim: #85827a; --bright: #17160f; --accent: #d9431a; --accent-bg: rgba(217,67,26,.09);
  --high: #d9431a; --medium: #a66a00; --low: #2f7d4f; --code: #f2f0e8;
  --mono: "Geist Mono", ui-monospace, Consolas, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 "Geist", ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-size: 18px; letter-spacing: -.03em; font-weight: 500; color: var(--bright); background: none; }
.stats { color: var(--dim); font-size: 12px; white-space: nowrap; }
.search { position: relative; flex: 1; max-width: 560px; margin-left: auto; }
.search input { width: 100%; padding: 7px 11px; color: var(--bright); background: #fff; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
.results { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.notice { padding: 6px 16px; background: var(--raised); color: var(--medium); font-size: 12px; border-bottom: 1px solid var(--line); }
main { flex: 1; display: flex; min-height: 0; }
aside { width: 250px; flex-shrink: 0; overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; }
#content { flex: 1; min-width: 0; overflow: auto; padding: 32px 40px 64px; }
#content > * { max-width: 1120px; margin-left: auto; margin-right: auto; }
.nav-link { display: block; padding: 5px 8px; margin-bottom: 2px; color: var(--bright); font-weight: 500; text-decoration: none; border-radius: 5px; }
.nav-link:hover { background: var(--raised); }
.more { padding: 4px 8px; color: var(--dim); font-size: 12px; }
.hero { padding: 40px 0 36px; }
.hero h1 { font-size: 52px; font-weight: 500; letter-spacing: -.035em; line-height: 1.05; }
.hero p { margin-top: 8px; color: var(--dim); }
.hero-search { max-width: 720px; margin: 28px 0 0; }
.hero-search input { width: 100%; padding: 13px 16px; font: inherit; font-size: 17px; color: var(--bright); background: #fff; border: 1px solid var(--bright); border-radius: 6px; }
.hero-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.hero-results { margin-top: 8px; max-height: 340px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px; }
.card { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--bright); }
.card > h2:first-child { margin-top: 0; }
.command { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; padding: 9px 12px; font: 12.5px var(--mono); color: var(--bright); background: var(--code); border: 1px solid var(--line); border-radius: 7px; }
.command code { flex: 1; min-width: 0; overflow-wrap: anywhere; font: inherit; }
.status { flex-shrink: 0; font: 11px var(--mono); color: var(--medium); }
.group { margin-bottom: 12px; }
.group > summary { cursor: pointer; padding: 4px 6px; font-size: 14px; font-weight: 500; color: var(--bright); }
.row { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 4px 8px; border-radius: 4px; }
.row:hover, .row.active { background: var(--raised); }
.row.active .name { color: var(--accent); }
.row .name { color: var(--bright); overflow-wrap: anywhere; }
.row .where { margin-left: auto; color: var(--dim); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
aside .where, aside .kind { display: none; }
.kind { flex-shrink: 0; min-width: 28px; font: 10px var(--mono); color: var(--dim); }
.guess { flex-shrink: 0; font-size: 10px; color: var(--medium); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
h1 { font-size: 38px; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; color: var(--bright); overflow-wrap: anywhere; }
h2 { margin: 22px 0 8px; font-size: 16px; font-weight: 500; color: var(--bright); }
h2 small { color: var(--dim); font-weight: 400; }
.location { color: var(--dim); font: 12px var(--mono); overflow-wrap: anywhere; }
.signature { margin-top: 8px; padding: 8px 10px; font: 12px var(--mono); color: var(--bright); background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
.actions { display: inline-flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.chip { padding: 3px 9px; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; }
.chip:hover { background: var(--raised); }
.tabs { display: flex; gap: 2px; margin-top: 16px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 7px 13px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--bright); }
.tabs a[aria-current] { color: var(--accent); border-color: var(--accent); font-weight: 500; }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 48px; }
.empty { padding: 6px 8px; color: var(--dim); font-size: 12.5px; }
.code { font: 12px/1.55 var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: 460px; padding: 8px 0; }
.line { display: flex; white-space: pre; min-width: max-content; padding-right: 12px; }
.line.target { background: var(--accent-bg); }
.line i { width: 52px; flex-shrink: 0; padding-right: 12px; text-align: right; color: var(--dim); font-style: normal; user-select: none; }
.metrics { display: flex; flex-wrap: wrap; gap: 14px 16px; margin-top: 28px; }
.metric { min-width: 130px; padding: 0 28px 0 0; }
.metric b { display: block; font-size: 40px; font-weight: 500; letter-spacing: -.03em; line-height: 1.15; color: var(--bright); }
.metric span { color: var(--dim); font-size: 12px; }
.risk-HIGH b { color: var(--high); } .risk-MEDIUM b { color: var(--medium); } .risk-LOW b { color: var(--low); }
.tree ul { list-style: none; margin-left: 14px; border-left: 1px solid var(--line); padding-left: 6px; }
.tree > ul { margin: 0; border: 0; padding: 0; }
.tree-node { display: flex; align-items: baseline; }
.toggle { width: 18px; flex-shrink: 0; text-align: center; color: var(--dim); }
.muted { color: var(--dim); font-size: 12px; margin-top: 8px; }
#map { display: block; margin-top: 12px; }
#map .box rect { fill: var(--panel); stroke: var(--line); rx: 5px; }
#map .box text { fill: var(--bright); font-size: 12px; }
#map .box text.sub { fill: var(--dim); font-size: 10.5px; }
#map .box { cursor: pointer; }
#map .box:hover rect, #map .box:focus rect { stroke: var(--accent); }
#map path { fill: none; stroke: var(--dim); opacity: .3; }
#map.hovering path { opacity: .06; }
#map.hovering path.on { opacity: .95; stroke: var(--accent); }
#map.hovering .box:not(.on) { opacity: .35; }
@media (max-width: 800px) { aside { display: none; } #content { padding: 20px 16px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="#" style="text-decoration:none">codive<span style="color:var(--accent)">.</span></a>
  <span class="stats" id="stats">Loading…</span>
  <div class="search" role="search">
    <input id="search" type="search" placeholder="Search functions, files, routes, tables  ( / )" aria-label="Search the code graph" autocomplete="off" disabled>
    <div class="results" id="results" hidden></div>
  </div>
</header>
<div class="notice" id="notice" hidden></div>
<main>
  <aside id="sidebar" aria-label="Browse the code graph"></aside>
  <div id="content" tabindex="-1"></div>
</main>
<script>
"use strict";
const MIN_CONFIDENCE = 0.5;
const CALL_KINDS = new Set(["CALLS", "REFERENCES", "ROUTES_TO", "READS_FROM", "WRITES_TO"]);
const SYMBOL_KINDS = new Set(["function", "method", "struct", "class", "interface", "test", "endpoint", "database", "broker", "scheduler"]);
const MAP_ROUTE = "@map";
const MAX_GROUP_ROWS = 300;
const MAX_MAP_PACKAGES = 120;
const $ = id => document.getElementById(id);

// h builds a DOM node. Strings always become text nodes, so repo content is never parsed as HTML.
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined) node.append(c);
  return node;
}
const svg = (tag, attrs, ...children) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  node.append(...children);
  return node;
};

const state = { nodes: [], byId: new Map(), out: new Map(), in: new Map(), symbolCounts: new Map() };

const nodeDir = n => n.kind === "package" ? n.label : (n.file_path.includes("/") ? n.file_path.slice(0, n.file_path.lastIndexOf("/")) : "(root)");
const isTestNode = n => n.kind === "test" || /(_test\.go|\.test\.|\.spec\.|(^|\/)test_)/.test(n.file_path);
const loc = n => n.kind === "package" ? n.label + "/" : n.file_path + (n.line_number ? ":" + n.line_number : "");
const nodeHash = (id, tab) => "#/" + encodeURIComponent(id) + (tab && tab !== "overview" ? "/" + tab : "");

function nodeRow(n, extra) {
  const current = currentRoute().id === n.id;
  return h("a", { class: "row" + (current ? " active" : ""), href: nodeHash(n.id), style: "color:inherit;text-decoration:none", "aria-current": current ? "true" : null },
    h("span", { class: "kind" }, n.kind.slice(0, 4)),
    h("span", { class: "name" }, n.label),
    extra || null,
    h("span", { class: "where", title: loc(n) }, loc(n)));
}

function edgeRows(edges, side) {
  return edges
    .map(e => ({ e, n: state.byId.get(e[side]) }))
    .filter(x => x.n)
    .sort((a, b) => b.e.confidence - a.e.confidence || a.n.label.localeCompare(b.n.label))
    .map(({ e, n }) => nodeRow(n, e.confidence < 1 && e.evidence === "inferred"
      ? h("span", { class: "guess", title: "Inferred, not proven: " + Math.round(e.confidence * 100) + "% confidence" }, "inferred") : null));
}

function list(title, rows, emptyText, note) {
  return h("section", { class: "card" },
    h("h2", null, title + " ", h("small", null, "(" + rows.length + ")")),
    rows.length ? rows : h("div", { class: "empty" }, emptyText),
    note ? h("p", { class: "muted" }, note) : null);
}

/* ---------- routing ---------- */
function goTestCommand(tests) {
  const byDir = new Map();
  for (const t of tests) {
    if (!t.file_path.endsWith(".go")) continue;
    const dir = nodeDir(t);
    if (!byDir.has(dir)) byDir.set(dir, new Set());
    byDir.get(dir).add(/^Test\w*$/.test(t.label) ? t.label : "*");
  }
  return [...byDir].sort().map(([dir, names]) => {
    const pkg = dir === "(root)" ? "." : "./" + dir;
    return names.has("*") || names.size > 15 ? `go test ${pkg}` : `go test ${pkg} -run '^(${[...names].sort().join("|")})$'`;
  }).join(" && ");
}

function commandBox(command) {
  return command ? h("div", { class: "command" }, h("code", null, command),
    h("button", { class: "chip", on: { click: e => copy(command, e.target) } }, "Copy")) : null;
}

function currentRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  return { id: parts[0] ? decodeURIComponent(parts[0]) : "", tab: parts[1] || "overview" };
}

function render() {
  const { id, tab } = currentRoute();
  renderSidebar();
  const content = $("content");
  content.replaceChildren();
  const node = state.byId.get(id);
  if (!id) renderHome(content);
  else if (id === MAP_ROUTE) renderMap(content);
  else if (!node) content.append(h("h1", null, "Not found"), h("p", { class: "muted" }, "This symbol is no longer in the graph. It may have been renamed or moved."));
  else renderNode(content, node, tab);
  content.scrollTop = 0;
}

/* ---------- sidebar ---------- */
function renderSidebar() {
  const byKind = kinds => state.nodes.filter(n => kinds.includes(n.kind)).sort((a, b) => a.label.localeCompare(b.label));
  const group = (title, nodes, open) => nodes.length
    ? h("details", { class: "group", open }, h("summary", null, title + " (" + nodes.length + ")"),
        nodes.slice(0, MAX_GROUP_ROWS).map(n => nodeRow(n)),
        nodes.length > MAX_GROUP_ROWS ? h("div", { class: "more" }, (nodes.length - MAX_GROUP_ROWS) + " more: use search") : null)
    : null;
  const endpoints = byKind(["endpoint"]);
  const packages = byKind(["package"]).filter(n => packageSymbolCount(n) > 0);
  $("sidebar").replaceChildren(...[
    h("a", { class: "nav-link", href: "#" }, "Your changes"),
    h("a", { class: "nav-link", href: nodeHash(MAP_ROUTE), style: "margin-bottom:12px" }, "Package map"),
    group("HTTP routes", endpoints.filter(n => !n.label.startsWith("CLI:")), true),
    group("CLI commands", endpoints.filter(n => n.label.startsWith("CLI:")), true),
    group("Database tables", byKind(["database"]), true),
    group("Message topics", byKind(["broker"]), true),
    group("Schedulers", byKind(["scheduler"]), true),
    group("Packages", packages, true),
  ].filter(Boolean));
}

function packageSymbolCount(pkg) {
  return state.symbolCounts.get(pkg.label) || 0;
}

/* ---------- home ---------- */
function renderHome(root) {
  const results = h("div", { class: "hero-results", hidden: true });
  const input = h("input", { type: "search", placeholder: "Function, file, route or table", "aria-label": "Search for what you are about to change", autocomplete: "off" });
  input.addEventListener("input", () => {
    const q = input.value;
    const found = searchNodes(q);
    results.replaceChildren(...(found.length ? found.map(n => nodeRow(n)) : [h("div", { class: "empty" }, "No matches for “" + q + "”.")]));
    results.hidden = !q.trim();
  });
  input.addEventListener("keydown", e => {
    const first = results.querySelector("a");
    if (e.key === "Enter" && first) location.hash = first.getAttribute("href");
  });
  const changes = h("div", null, h("p", { class: "muted", style: "" }, "Checking your uncommitted changes…"));
  root.append(
    h("div", { class: "hero" },
      h("h1", null, "What are you about to change?"),
      h("p", null, "See what calls it, what it affects, and which tests to run."),
      h("div", { class: "hero-search" }, input, results)),
    changes);
  input.focus();
  renderChanges(changes);
}

const SYMBOL_TEXT = /^\[[^\]]+\] (.+) \(L(\d+)\)$/;

async function renderChanges(box) {
  let data;
  try {
    data = await fetchJSON("/api/explorer/changes");
  } catch (err) {
    box.replaceChildren(h("p", { class: "muted" }, "Couldn't read git changes: " + err.message));
    return;
  }
  if (currentRoute().id) return;
  const files = data.files || [];
  if (!files.length) {
    box.replaceChildren(h("p", { class: "muted" }, "No uncommitted changes" + (data.branch ? " on " + data.branch : "") + ". Search above, or browse the sidebar."));
    return;
  }

  const symbols = [], unmatched = [];
  const fileRows = files.map(f => {
    const rows = (f.affected_symbols || []).map(text => {
      const m = SYMBOL_TEXT.exec(text);
      const node = m && state.byId.get(`sym:${f.path}:${m[1]}:${m[2]}`);
      if (node) { symbols.push(node); return nodeRow(node); }
      unmatched.push(text);
      return h("div", { class: "row" }, h("span", { class: "name" }, text));
    });
    return h("div", { style: "margin-top:10px" },
      h("div", { class: "location" }, f.status + "  " + f.path + (f.changed_line_count ? "  (" + f.changed_line_count + (f.changed_line_count === 1 ? " line)" : " lines)") : "")),
      f.note ? h("div", { class: "empty" }, f.note) : null,
      rows);
  });

  const summary = h("div", null, h("p", { class: "muted" }, symbols.length ? "Working out what this affects…" : "No indexed symbols were touched by these changes."));
  box.replaceChildren(
    h("section", { class: "card" }, h("h2", null, `Your changes on ${data.branch || "this branch"} `, h("small", null, `(${data.total_changed} file${data.total_changed === 1 ? "" : "s"})`)), fileRows,
      unmatched.length ? h("p", { class: "muted" }, "Some line numbers have moved since the last index. Run codive update for full results.") : null),
    summary);
  if (!symbols.length) return;

  const reports = (await Promise.all(symbols.slice(0, 40).map(n =>
    fetchJSON("/api/explorer/impact?node_id=" + encodeURIComponent(n.id)).catch(() => null)))).filter(Boolean);
  if (currentRoute().id) return;
  const changed = new Set(symbols.map(n => n.id));
  const callers = new Map(), tests = new Map(), affected = new Set();
  for (const r of reports) {
    for (const c of [...(r.direct_callers || []), ...(r.transitive_callers || [])]) if (!changed.has(c.id)) callers.set(c.id, c);
    for (const t of r.tests_to_run || []) tests.set(t.id, t);
    for (const f of r.impacted_files || []) affected.add(f);
  }
  const testList = [...tests.values()];
  summary.replaceChildren(...[
    h("div", { class: "metrics" }, metric(symbols.length, "symbols changed"), metric(callers.size, "callers affected"), metric(affected.size, "files affected"), metric(tests.size, "tests to run")),
    symbols.length > 40 ? h("p", { class: "muted" }, `Summary covers the first 40 of ${symbols.length} changed symbols.`) : null,
    h("section", { class: "card" }, h("h2", null, "Run these tests"), testList.length ? commandBox(goTestCommand(testList)) : h("div", { class: "empty" }, "No related tests found, so these changes may not be covered."), goTestCommand(testList) === "" && testList.length ? h("div", { class: "empty" }, "Test commands are generated for Go only.") : null),
    h("div", { class: "columns" },
      list("Callers affected", [...callers.values()].sort((a, b) => a.label.localeCompare(b.label)).slice(0, 100).map(c => nodeRow(c)), "No other code calls what you changed."),
      list("Tests", testList.sort((a, b) => a.label.localeCompare(b.label)).slice(0, 100).map(t => nodeRow(t)), "None found."))].filter(Boolean));
}

/* ---------- node page ---------- */
function renderNode(root, n, tab) {
  const tabs = n.kind === "package" ? [] : [["overview", "Overview"], ["flow", "Execution flow"], ["impact", "Blast radius"]];
  root.append(...[
    h("div", { class: "kind" }, n.kind),
    h("h1", null, n.label),
    h("div", { class: "location" }, loc(n)),
    n.signature ? h("div", { class: "signature" }, n.signature) : null,
    h("div", { class: "actions" },
      h("button", { class: "chip", on: { click: e => copy(n.file_path, e.target) } }, "Copy path"),
      h("button", { class: "chip", title: "Pass this to the get_execution_flow MCP tool", on: { click: e => copy(n.id, e.target) } }, "Copy node ID")),
    tabs.length ? h("nav", { class: "tabs" }, tabs.map(([key, label]) =>
      h("a", { href: nodeHash(n.id, key), "aria-current": key === tab ? "page" : null }, label))) : null,
  ].filter(Boolean));

  const body = h("div");
  root.append(body);
  if (n.kind === "package") renderPackage(body, n);
  else if (tab === "flow") renderFlow(body, n);
  else if (tab === "impact") renderImpact(body, n);
  else renderOverview(body, n);
}

function renderOverview(body, n) {
  const allIncoming = (state.in.get(n.id) || []).filter(e => CALL_KINDS.has(e.kind));
  const fromTest = e => { const src = state.byId.get(e.source_id); return src && isTestNode(src); };
  const incoming = allIncoming.filter(e => !fromTest(e));
  const testCallers = allIncoming.filter(fromTest);
  const outgoing = (state.out.get(n.id) || []).filter(e => CALL_KINDS.has(e.kind));
  const contains = (state.out.get(n.id) || []).filter(e => e.kind === "CONTAINS");
  const staticNote = "From static analysis: calls through standard library interfaces such as http.ResponseWriter, or through reflection, may be missing. Inferred links are possible interface targets.";
  body.append(h("div", { class: "columns" },
    list(n.kind === "database" ? "Used by" : "Called by", edgeRows(incoming, "source_id"), n.kind === "endpoint" ? "Entry point: nothing in the repo calls it." : "No callers found.", staticNote),
    n.kind === "file"
      ? list("Declares", edgeRows(contains, "target_id"), "No symbols found in this file.")
      : list(n.kind === "endpoint" ? "Handled by" : "Calls", edgeRows(outgoing, "target_id"), "No calls to other repo code found.")));
  if (testCallers.length) body.append(list("Called from tests", edgeRows(testCallers, "source_id"), ""));
  renderSource(body, n);
}

let snippetRequest = 0;
function renderSource(body, n) {
  const box = h("div", { class: "code" }, h("div", { class: "empty" }, "Loading source…"));
  body.append(h("h2", null, "Source"), box);
  const request = ++snippetRequest;
  fetchJSON("/api/snippet?radius=14&file=" + encodeURIComponent(n.file_path) + "&line=" + (n.line_number || 1))
    .then(data => {
      if (request !== snippetRequest) return;
      box.replaceChildren(...data.content.split("\n").map((text, i) => {
        const number = data.start_line + i;
        return h("div", { class: "line" + (number === data.target_line && n.line_number ? " target" : "") }, h("i", null, String(number)), text);
      }));
    })
    .catch(err => { if (request === snippetRequest) box.replaceChildren(h("div", { class: "empty" }, "Could not load source: " + err.message)); });
}

function renderFlow(body, n) {
  body.append(h("p", { class: "muted" }, "Tracing…"));
  fetchJSON("/api/explorer/flow?node_id=" + encodeURIComponent(n.id)).then(flow => {
    if (currentRoute().id !== n.id) return;
    const children = new Map();
    for (const step of flow.steps) {
      if (!step.call_edge) continue;
      const parent = step.call_edge.source_id;
      if (!children.has(parent)) children.set(parent, []);
      children.get(parent).push(step);
    }
    const branch = step => {
      const kids = children.get(step.node.id) || [];
      const inner = kids.length ? h("ul", { hidden: step.depth >= 2 }, kids.map(s => h("li", null, branch(s)))) : null;
      const toggle = h("button", { class: "toggle", "aria-label": "Expand or collapse " + step.node.label, on: { click: () => { inner.hidden = !inner.hidden; toggle.textContent = inner.hidden ? "▸" : "▾"; } } }, inner ? (inner.hidden ? "▸" : "▾") : "");
      const row = nodeRow(step.node, step.call_edge && step.call_edge.evidence === "inferred" ? h("span", { class: "guess" }, "inferred") : null);
      if (!inner) toggle.disabled = true;
      return [h("div", { class: "tree-node" }, toggle, row), inner];
    };
    body.replaceChildren(
      h("div", { class: "metrics" }, metric(flow.total_steps, "steps"), metric(flow.branch_points, "branch points"), metric(flow.max_depth, "max depth")),
      h("h2", null, "Call tree"),
      flow.steps.length > 1
        ? h("div", { class: "tree" }, h("ul", null, h("li", null, branch(flow.steps[0]))))
        : h("div", { class: "empty" }, "This doesn't call any other repo code that could be resolved."),
      h("p", { class: "muted" }, "Each symbol appears once, under the first caller reached, so this shows what is reachable rather than one runtime path."),
      list("Related tests", (flow.related_tests || []).map(t => nodeRow(t)), "No related tests found."));
  }).catch(err => showError(body, err));
}

function renderImpact(body, n) {
  body.append(h("p", { class: "muted" }, "Analyzing…"));
  fetchJSON("/api/explorer/impact?node_id=" + encodeURIComponent(n.id)).then(report => {
    if (currentRoute().id !== n.id) return;
    const direct = report.direct_callers || [], transitive = report.transitive_callers || [], tests = report.tests_to_run || [], files = report.impacted_files || [];
    body.replaceChildren(
      h("div", { class: "metrics" },
        metric(report.risk_level, "risk", "risk-" + report.risk_level),
        metric(direct.length, "direct callers"), metric(transitive.length, "indirect callers"),
        metric(files.length, "files affected"), metric(tests.length, "tests to run")),
      h("p", { class: "muted" }, "Risk is a rough guide based on the caller and file counts within two call hops."),
      commandBox(goTestCommand(tests)),
      h("div", { class: "columns" },
        list("Direct callers", direct.map(c => nodeRow(c)), "No production code calls this directly."),
        list("Indirect callers", transitive.map(c => nodeRow(c)), "None within two hops.")),
      h("div", { class: "columns" },
        list("Tests to run", tests.map(t => nodeRow(t)), "No tests found. Changes here are not covered by a known test."),
        list("Files affected", files.sort().map(f => h("div", { class: "row" }, h("span", { class: "name location" }, f))), "None.")));
  }).catch(err => showError(body, err));
}

function metric(value, label, cls) {
  return h("div", { class: "metric " + (cls || "") }, h("b", null, String(value)), h("span", null, label));
}
function showError(body, err) {
  body.replaceChildren(h("p", { class: "empty" }, "Something went wrong: " + err.message));
}

/* ---------- packages ---------- */
function packageDeps() {
  const deps = new Map();
  for (const edges of state.out.values()) for (const e of edges) {
    if (e.kind !== "CALLS" || e.confidence < MIN_CONFIDENCE) continue;
    const a = state.byId.get(e.source_id), b = state.byId.get(e.target_id);
    if (!a || !b || isTestNode(a) || isTestNode(b)) continue;
    const from = nodeDir(a), to = nodeDir(b);
    if (from === to) continue;
    const key = from + "\0" + to;
    deps.set(key, (deps.get(key) || 0) + 1);
  }
  return [...deps].map(([key, weight]) => { const [from, to] = key.split("\0"); return { from, to, weight }; });
}

function renderPackage(body, n) {
  const pkgNode = dir => state.byId.get("pkg:" + dir);
  const deps = packageDeps();
  const pkgRows = (items, side) => items.sort((a, b) => b.weight - a.weight).map(d => pkgNode(d[side])).filter(Boolean).map(p => nodeRow(p));
  const contains = (state.out.get(n.id) || []).filter(e => e.kind === "CONTAINS");
  body.append(
    h("div", { class: "columns" },
      list("Used by packages", pkgRows(deps.filter(d => d.to === n.label), "from"), "No other package calls into this one."),
      list("Depends on packages", pkgRows(deps.filter(d => d.from === n.label), "to"), "It doesn't call other repo packages.")),
    list("Files", edgeRows(contains, "target_id"), "No indexed files."));
}

/* ---------- package map ---------- */
function renderMap(root) {
  const packages = state.nodes.filter(n => n.kind === "package").map(n => ({ n, count: packageSymbolCount(n) })).filter(p => p.count > 0);
  root.append(h("h1", null, "Package map"), h("p", { class: "muted" }, "Packages call the ones to their right. Line weight shows the number of call sites; test code is excluded. Select a package for details."));
  if (packages.length > MAX_MAP_PACKAGES) {
    root.append(h("p", { class: "muted" }, `Showing the ${MAX_MAP_PACKAGES} largest of ${packages.length} packages. Use search or the sidebar for the rest.`));
    packages.sort((a, b) => b.count - a.count);
    packages.length = MAX_MAP_PACKAGES;
  }
  if (!packages.length) {
    root.append(h("p", { class: "empty" }, "No packages with symbols are indexed yet. Run codive init, then reload this page."));
    return;
  }
  const names = new Set(packages.map(p => p.n.label));
  const deps = packageDeps().filter(d => names.has(d.from) && names.has(d.to));

  // Longest-path layering; edges closing a cycle are ignored when assigning layers.
  const callees = new Map();
  for (const d of deps) { if (!callees.has(d.from)) callees.set(d.from, []); callees.get(d.from).push(d.to); }
  const layer = new Map(), onStack = new Set();
  const visit = (name, depth) => {
    if (onStack.has(name) || (layer.get(name) ?? -1) >= depth) return;
    layer.set(name, depth);
    onStack.add(name);
    for (const to of callees.get(name) || []) visit(to, depth + 1);
    onStack.delete(name);
  };
  const called = new Set(deps.map(d => d.to));
  for (const name of [...names].sort()) if (!called.has(name)) visit(name, 0);
  for (const name of [...names].sort()) if (!layer.has(name)) visit(name, 0);

  const W = 210, H = 44, GX = 90, GY = 12;
  const columns = [];
  for (const p of packages) (columns[layer.get(p.n.label)] ||= []).push(p);
  const pos = new Map();
  columns.forEach((col, x) => col.sort((a, b) => a.n.label.localeCompare(b.n.label)).forEach((p, y) => pos.set(p.n.label, { x: x * (W + GX), y: y * (H + GY) })));
  const width = columns.length * (W + GX) - GX + 4, height = Math.max(...columns.map(c => c ? c.length : 0)) * (H + GY) + 4;

  const map = svg("svg", { id: "map", width, height, viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Package dependency map" });
  const lines = deps.map(d => {
    const a = pos.get(d.from), b = pos.get(d.to);
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, bend = Math.max(40, Math.abs(x2 - x1) / 2);
    const line = svg("path", { d: `M${x1} ${y1} C${x1 + bend} ${y1} ${x2 - bend} ${y2} ${x2} ${y2}`, "stroke-width": Math.min(4, 0.8 + Math.log2(d.weight) / 2) });
    line.append(svg("title", null, `${d.from} → ${d.to}: ${d.weight} call site${d.weight === 1 ? "" : "s"}`));
    map.append(line);
    return { line, d };
  });
  const boxes = new Map();
  const highlight = name => {
    map.classList.toggle("hovering", !!name);
    const near = new Set([name]);
    for (const { line, d } of lines) {
      const on = d.from === name || d.to === name;
      line.classList.toggle("on", on);
      if (on) near.add(d.from).add(d.to);
    }
    for (const [key, box] of boxes) box.classList.toggle("on", near.has(key));
  };
  const clip = s => s.length > 30 ? "…" + s.slice(-29) : s;
  for (const p of packages) {
    const name = p.n.label, at = pos.get(name);
    const title = svg("text", { x: 10, y: 19 }); title.textContent = clip(name);
    const sub = svg("text", { x: 10, y: 35, class: "sub" }); sub.textContent = p.count + " symbol" + (p.count === 1 ? "" : "s");
    const tip = svg("title"); tip.textContent = name;
    const open = () => { location.hash = nodeHash(p.n.id); };
    const box = svg("g", { class: "box", transform: `translate(${at.x + 1} ${at.y + 1})`, tabindex: 0, role: "link", "aria-label": name }, tip, svg("rect", { width: W - 2, height: H - 2 }), title, sub);
    box.addEventListener("click", open);
    box.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
    box.addEventListener("mouseenter", () => highlight(name));
    box.addEventListener("mouseleave", () => highlight(null));
    box.addEventListener("focus", () => highlight(name));
    box.addEventListener("blur", () => highlight(null));
    boxes.set(name, box);
    map.append(box);
  }
  root.append(map);
}

/* ---------- search ---------- */
function searchNodes(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const score = n => {
    const label = n.label.toLowerCase();
    let s = label === q ? 0 : label.startsWith(q) ? 1 : label.includes(q) ? 2 : n.file_path.toLowerCase().includes(q) ? 3 : -1;
    if (s >= 0 && isTestNode(n)) s += 0.5;
    return s;
  };
  return state.nodes.filter(n => n.kind !== "package" || n.label.toLowerCase().includes(q))
    .map(n => [score(n), n]).filter(([s]) => s >= 0)
    .sort((a, b) => a[0] - b[0] || a[1].label.length - b[1].label.length || a[1].label.localeCompare(b[1].label))
    .slice(0, 40).map(([, n]) => n);
}

function closeResults() { $("results").hidden = true; }
function updateResults() {
  const q = $("search").value;
  const found = searchNodes(q);
  const box = $("results");
  box.replaceChildren(...(found.length ? found.map(n => nodeRow(n)) : [h("div", { class: "empty" }, "No matches for “" + q + "”.")]));
  box.hidden = !q.trim();
}
$("search").addEventListener("input", updateResults);
$("search").addEventListener("keydown", e => {
  const rows = [...$("results").querySelectorAll("a")];
  if (e.key === "Enter" && rows[0]) { location.hash = rows[0].getAttribute("href"); closeResults(); $("search").select(); }
  else if (e.key === "ArrowDown" && rows[0]) { e.preventDefault(); rows[0].focus(); }
  else if (e.key === "Escape") closeResults();
});
$("results").addEventListener("keydown", e => {
  const rows = [...$("results").querySelectorAll("a")], i = rows.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); rows[Math.min(i + 1, rows.length - 1)].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (i <= 0) $("search").focus(); else rows[i - 1].focus(); }
  else if (e.key === "Escape") { closeResults(); $("search").focus(); }
});
$("results").addEventListener("click", closeResults);
document.addEventListener("click", e => { if (!e.target.closest(".search")) closeResults(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("search").focus(); $("search").select(); }
});

/* ---------- plumbing ---------- */
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error((await res.text()).trim() || "HTTP " + res.status);
  return res.json();
}
function copy(text, button) {
  const label = button.textContent;
  const done = msg => { button.textContent = msg; setTimeout(() => { button.textContent = label; }, 1200); };
  navigator.clipboard.writeText(text).then(() => done("Copied"), () => done("Copy failed"));
}

async function start() {
  try {
    const graph = await fetchJSON("/api/explorer/graph?limit=200000");
    state.nodes = graph.nodes || [];
    for (const n of state.nodes) state.byId.set(n.id, n);
    for (const e of graph.edges || []) {
      if (!state.out.has(e.source_id)) state.out.set(e.source_id, []);
      if (!state.in.has(e.target_id)) state.in.set(e.target_id, []);
      state.out.get(e.source_id).push(e);
      state.in.get(e.target_id).push(e);
    }
    for (const n of state.nodes) {
      if (SYMBOL_KINDS.has(n.kind) && n.file_path) state.symbolCounts.set(nodeDir(n), (state.symbolCounts.get(nodeDir(n)) || 0) + 1);
    }
    const count = kind => state.nodes.filter(n => n.kind === kind).length;
    $("stats").textContent = count("file") + " files · " + (state.nodes.filter(n => SYMBOL_KINDS.has(n.kind)).length) + " symbols";
    const notices = [...(graph.warnings || [])];
    if (graph.truncated) notices.push("Large repo: showing " + state.nodes.length + " of " + graph.total_nodes + " graph nodes. Some symbols and links are not listed here.");
    if (notices.length) {
      $("notice").textContent = notices.join(" ");
      $("notice").hidden = false;
    }
    if (false) {
      $("notice").textContent = "Large repo: showing " + state.nodes.length + " of " + graph.total_nodes + " graph nodes. Some symbols and links are not listed here.";
      $("notice").hidden = false;
    }
    $("search").disabled = false;
    window.addEventListener("hashchange", render);
    render();
  } catch (err) {
    $("stats").textContent = "";
    $("content").replaceChildren(h("h1", null, "Could not load the code graph"), h("p", { class: "muted" }, err.message), h("p", { class: "muted" }, "Check that codive web is still running, then reload this page."));
  }
}
start();
</script>
