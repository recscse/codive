name: CI & Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A branch with an open pull request triggers this workflow twice, once for the
# push and once for the pull request, and every new push makes the previous run
# stale. One group per branch: the newest run wins and the rest are cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.27' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v -count=1 -race ./...
