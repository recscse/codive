name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            ext: ""
            compress: tar
          - os: darwin
            arch: amd64
            ext: ""
            compress: tar
          - os: linux
            arch: amd64
            ext: ""
            compress: tar
          - os: linux
            arch: arm64
            ext: ""
            compress: tar
          - os: windows
            arch: amd64
            ext: ".exe"
            compress: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          
          BIN_NAME="ctxd${{ matrix.ext }}"
          OUTPUT_DIR="dist/ctxd_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "${OUTPUT_DIR}"
          
          go build -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${COMMIT:0:7} -X main.BuildDate=${BUILD_DATE}" -o "${OUTPUT_DIR}/${BIN_NAME}" .
          
          cd dist
          if [ "${{ matrix.compress }}" = "tar" ]; then
            tar -czvf "ctxd_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" -C "ctxd_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}" "${BIN_NAME}"
          else
            zip -j "ctxd_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.zip" "ctxd_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}/${BIN_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          mkdir -p release_assets
          cd release_assets
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
