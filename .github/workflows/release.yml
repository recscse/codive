name: Release devctx Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME="devctx${{ matrix.ext }}"
          go build -ldflags="-s -w -X main.Version=${TAG_NAME} -X main.GitCommit=${{ github.sha }} -X main.BuildDate=$(date -u +%Y-%m-%d)" -o dist/${OUTPUT_NAME} .

      - name: Package Binary (Windows Zip)
        if: matrix.archive == 'zip'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          zip -j "devctx_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" devctx.exe
          cd ..

      - name: Package Binary (Unix Tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          tar -czvf "devctx_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" devctx
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
