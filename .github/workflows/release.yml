name: Release codive Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Nothing is built or published unless the full suite (including the upgrade
  # integration tests) passes on every OS we ship for.
  test:
    name: Pre-release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME="codive${{ matrix.ext }}"
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${TAG_NAME} -X main.GitCommit=${{ github.sha }} -X main.BuildDate=$(date -u +%Y-%m-%d)" -o dist/${OUTPUT_NAME} .

      # Native smoke test on Linux runner
      - name: Smoke Test Binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/codive version
          ./dist/codive --help

      - name: Package Binary (Windows Zip)
        if: matrix.archive == 'zip'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          ARCHIVE_NAME="codive_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          zip -j "$ARCHIVE_NAME" codive.exe
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cd ..

      - name: Package Binary (Unix Tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          ARCHIVE_NAME="codive_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" codive
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > checksums.txt
          cat checksums.txt
          cd ..

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          python3 -c "
          import sys, re
          tag = sys.argv[1].lstrip('v')
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              pattern = rf'## \[v?{re.escape(tag)}\][^\n]*\n(.*?)(?=\n---\s*\n\s*## |\n## |\Z)'
              m = re.search(pattern, text, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          except Exception as e:
              print(f'Error reading CHANGELOG: {e}', file=sys.stderr)
          
          if not notes:
              notes = f'Release {tag} of codive.'
          
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n\n')
          print(f'Successfully prepared release notes for {tag}')
          " "$TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-publish check: download the release exactly as users and `codive upgrade`
  # do (versioned asset name + .sha256), verify, extract, and run it on each OS.
  verify:
    name: Verify published release (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux_amd64.tar.gz
          - os: macos-latest
            asset: darwin_arm64.tar.gz
          - os: windows-latest
            asset: windows_amd64.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Download, checksum, extract, run
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          NAME="codive_${TAG}_${{ matrix.asset }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}"
          mkdir verify && cd verify
          curl -fsSL --retry 5 --retry-delay 5 -o "$NAME" "$URL"
          curl -fsSL --retry 5 --retry-delay 5 -o "$NAME.sha256" "$URL.sha256"
          EXPECTED=$(cut -d' ' -f1 "$NAME.sha256")
          ACTUAL=$(openssl dgst -sha256 "$NAME" | awk '{print $NF}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          case "$NAME" in
            *.zip) unzip -o "$NAME"; BIN=./codive.exe ;;
            *)     tar -xzf "$NAME"; BIN=./codive ;;
          esac
          OUT=$("$BIN" version --no-color)
          echo "$OUT"
          echo "$OUT" | grep -q "${TAG#v}" || { echo "binary does not report ${TAG}"; exit 1; }
