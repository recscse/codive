name: Release codive Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME="codive${{ matrix.ext }}"
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${TAG_NAME} -X main.GitCommit=${{ github.sha }} -X main.BuildDate=$(date -u +%Y-%m-%d)" -o dist/${OUTPUT_NAME} .

      # Native smoke test on Linux runner
      - name: Smoke Test Binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/codive version
          ./dist/codive --help

      - name: Package Binary (Windows Zip)
        if: matrix.archive == 'zip'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          ARCHIVE_NAME="codive_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          zip -j "$ARCHIVE_NAME" codive.exe
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cd ..

      - name: Package Binary (Unix Tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd dist
          ARCHIVE_NAME="codive_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" codive
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > checksums.txt
          cat checksums.txt
          cd ..

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          python3 -c "
          import sys, re
          tag = sys.argv[1].lstrip('v')
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              pattern = rf'## \[v?{re.escape(tag)}\][^\n]*\n(.*?)(?=\n---\s*\n\s*## |\n## |\Z)'
              m = re.search(pattern, text, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          except Exception as e:
              print(f'Error reading CHANGELOG: {e}', file=sys.stderr)
          
          if not notes:
              notes = f'Release {tag} of codive.'
          
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n\n')
          print(f'Successfully prepared release notes for {tag}')
          " "$TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
